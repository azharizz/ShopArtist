  <!-- Pop Art mark: a halftone speech burst holding an awning-shop silhouette. -->
  <defs>
    <pattern id="sa-dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.1" fill="#14121a" opacity=".32" />
    </pattern>
  </defs>

  <!-- Burst -->
  <path d="M32 1.5 38 13 50 7.5 48.5 20.5 61.5 20 55 31 63 40.5 50.5 44 55 56 42.5 53.5 40.5 62.5 32 55.5 23.5 62.5 21.5 53.5 9 56 13.5 44 1 40.5 9 31 2.5 20 15.5 20.5 14 7.5 26 13Z"
        fill="#ffd400" stroke="#14121a" stroke-width="3" stroke-linejoin="round" />
  <path d="M32 1.5 38 13 50 7.5 48.5 20.5 61.5 20 55 31 63 40.5 50.5 44 55 56 42.5 53.5 40.5 62.5 32 55.5 23.5 62.5 21.5 53.5 9 56 13.5 44 1 40.5 9 31 2.5 20 15.5 20.5 14 7.5 26 13Z"
        fill="url(#sa-dots)" />

  <!-- Shop: awning + window -->
  <rect x="18" y="29" width="28" height="18" fill="#fffaf0" stroke="#14121a" stroke-width="3" />
  <path d="M15 29 19 20h26l4 9Z" fill="#ff2e3f" stroke="#14121a" stroke-width="3" stroke-linejoin="round" />
  <path d="M24.5 20 22 29M32 20v9M39.5 20 42 29" stroke="#14121a" stroke-width="2.4" />
  <rect x="23" y="34" width="8" height="13" fill="#19d3e0" stroke="#14121a" stroke-width="2.6" />
  <rect x="35" y="34" width="7" height="7" fill="#ff5fa2" stroke="#14121a" stroke-width="2.6" />
</svg>
